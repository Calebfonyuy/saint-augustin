# =============================================================================
# SaintAugustin – Nginx API Gateway (Development)
# Routes requests to the correct backend service by path prefix.
# Mirrors the Kubernetes Ingress routing defined in SRS Section 5.3.
# Ref: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
# =============================================================================

# Docker's embedded DNS — resolves service names within the Compose network.
# Setting valid=30s makes Nginx re-query DNS every 30 s so that it picks up
# new IPs after a container restarts, rather than caching the address forever.
resolver 127.0.0.11 valid=30s ipv6=off;

upstream auth_service {
    server auth-service:8000;
}

upstream projection_service {
    server projection-service:3000;
}

upstream frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # --- API Routes (path-based routing) ---
    #
    # Nginx uses longest-prefix matching for location blocks, so more-specific
    # prefixes (/api/projection/) always win over the catch-all (/api/).
    #
    # All current API domains (auth, songs, songbooks, sheets, playlists, share)
    # live in the single Auth Service until Phase 5 extracts them. The catch-all
    # /api/ block routes everything there; only /api/projection/ diverges.

    # Catch-all: any /api/* request not matched below goes to the Auth Service.
    location /api/ {
        proxy_pass http://auth_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Projection Service HTTP API (sessions CRUD) ---
    # More specific than /api/ so it wins — routes to NestJS, not Laravel.
    location /api/projection/ {
        proxy_pass http://projection_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NOTE: /api/auth/ is intentionally omitted — it is covered by the /api/
    # catch-all above. Add an explicit block here only if auth is ever extracted
    # to its own upstream that differs from auth_service.

    # --- WebSocket route for projection ---
    location /ws/projection/ {
        proxy_pass http://projection_service/ws/projection/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Socket.IO specific (used by projection) ---
    location /socket.io/ {
        proxy_pass http://projection_service/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Frontend (catch-all) ---
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite HMR WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

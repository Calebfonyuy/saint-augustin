<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo-96.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo-152.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaintAugustin</title>
    <!-- Apply the persisted colour scheme before first paint to avoid a
         light-mode flash. The theme store (src/stores/theme.ts) takes over
         reactively once the app mounts. Keep the storage key + logic in sync. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('staug.theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* localStorage/matchMedia unavailable — default to light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

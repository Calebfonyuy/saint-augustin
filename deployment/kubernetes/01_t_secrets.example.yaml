# Copy to `secrets.yaml`, fill in real values, then `kubectl apply -f`
# (do NOT commit the populated file — `.gitignore` excludes `secrets.yaml`).
apiVersion: v1
kind: Secret
metadata:
  name: staug-secrets
  namespace: staug
type: Opaque
stringData:
  # ── Laravel ───────────────────────────────────────────────────────
  APP_KEY: "base64:REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"

  # ── STAUG data-interchange ────────────────────────────────────────
  # HMAC signing key for exported archives (generate with `openssl rand
  # -base64 32`). DR-critical: must match across instances that need to
  # validate each other's exports.
  STAUG_SIGNING_KEY: "REPLACE_ME"

  # ── Database ──────────────────────────────────────────────────────
  DB_AUTH_NAME: "REPLACE_ME"
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"

  # ── MinIO ─────────────────────────────────────────────────────────
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "REPLACE_ME"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "REPLACE_ME"

  # ── SMTP ──────────────────────────────────────────────────────────
  MAIL_HOST: ""
  MAIL_PORT: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_SCHEME: "tls"

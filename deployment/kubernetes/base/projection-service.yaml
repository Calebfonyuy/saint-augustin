# Projection Service — NestJS 10 + Socket.IO.
#
# Stateless from the pod's point of view (all session state lives in
# Redis), so we can scale horizontally — but Socket.IO needs sticky
# sessions or the Redis adapter for fan-out across pods. The Ingress
# template enables sticky sessions; if you scale beyond ~3 replicas,
# enable @socket.io/redis-adapter in the projection codebase first.
apiVersion: v1
kind: Service
metadata:
  name: projection-service
  namespace: saintaugustin
spec:
  selector:
    app: projection-service
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-service
  namespace: saintaugustin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projection-service
  template:
    metadata:
      labels:
        app: projection-service
    spec:
      containers:
        - name: projection
          image: ghcr.io/REPLACE_ME/saintaugustin-projection:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: saintaugustin-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: saintaugustin-config
                  key: PROJECTION_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: saintaugustin-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: saintaugustin-config
                  key: REDIS_PORT
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

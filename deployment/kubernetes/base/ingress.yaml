# Single Ingress fronting all three services. Path order matters —
# the more specific `/api/projection` and `/socket.io` prefixes must
# come before the catch-all `/api`.
#
# WebSocket support: the standard nginx Ingress controller passes
# `Upgrade`/`Connection` headers automatically when `kubernetes.io/
# ingress.class: nginx` is set; sticky sessions are turned on so a
# single Socket.IO client keeps hitting the same projection pod.
#
# Replace `saintaugustin.example.com` with your real hostname (or
# patch it in an overlay).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saintaugustin
  namespace: saintaugustin
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "saintaugustin-aff"
spec:
  ingressClassName: nginx
  rules:
    - host: saintaugustin.example.com
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: projection-service
                port:
                  number: 3000
          - path: /ws/projection
            pathType: Prefix
            backend:
              service:
                name: projection-service
                port:
                  number: 3000
          - path: /api/projection
            pathType: Prefix
            backend:
              service:
                name: projection-service
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

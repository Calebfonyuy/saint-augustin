# Copy to `secrets.yaml`, fill in real values, then `kubectl apply -f`
# (do NOT commit the populated file — `.gitignore` excludes `secrets.yaml`).
#
# Generate APP_KEY with:
#   docker run --rm php:8.3-cli-alpine \
#     php -r "echo 'base64:'.base64_encode(random_bytes(32));"
#
# Generate JWT_SECRET / MinIO secret with:
#   openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: saintaugustin-secrets
  namespace: saintaugustin
type: Opaque
stringData:
  # ── Laravel ───────────────────────────────────────────────────────
  APP_KEY: "base64:REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"

  # ── Database ──────────────────────────────────────────────────────
  DB_PASSWORD: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"

  # ── MinIO ─────────────────────────────────────────────────────────
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "REPLACE_ME"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "REPLACE_ME"

  # ── SMTP (only if MAIL_MAILER=smtp) ───────────────────────────────
  MAIL_HOST: ""
  MAIL_PORT: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""

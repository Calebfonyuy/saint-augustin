# MinIO — S3-compatible storage for song-sheet uploads.
# A one-shot Job seeds the bucket on first apply (idempotent thanks to
# `mc mb --ignore-existing`).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: staug
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 31003
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 31004

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-data-pv
  namespace: staug
  labels:
    app: minio
spec:
  # Capacity matches the claim below (20Gi) so the PV/PVC pair is
  # self-consistent. hostPath is not enforced against this number, but an
  # accurate value avoids confusing `kubectl get pv` output.
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /home/data/staug/minio
    type: DirectoryOrCreate
  claimRef:
    namespace: staug
    name: minio-data
  # If your cluster has more than one node, uncomment and set the node
  # where the data lives. hostPath is node-local; without this the pod
  # could be scheduled to a node that does not have the directory.
  # nodeAffinity:
  #   required:
  #     nodeSelectorTerms:
  #       - matchExpressions:
  #           - key: kubernetes.io/hostname
  #             operator: In
  #             values: ["your-node-name"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: staug
spec:
  volumeName: minio-data-pv
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: staug
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
# Bucket bootstrap — runs once per release. Re-running is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: staug
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: AWS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: staug-config
                  key: AWS_BUCKET
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for minio..."; sleep 2
              done
              mc mb --ignore-existing "local/$AWS_BUCKET"
              mc anonymous set download "local/$AWS_BUCKET/public" || true
              # Expire full-DB exports after 48h (FR-DF-3). The 48h object
              # lifetime is aligned to the 48h presigned link the export job
              # emails, so link and object die together. Newer `mc` uses
              # `ilm rule add`; older builds use `ilm add` — try both.
              mc ilm rule add "local/$AWS_BUCKET" --expire-days 2 --prefix 'exports/' \
                || mc ilm add --expiry-days 2 --prefix 'exports/' "local/$AWS_BUCKET" \
                || echo "warning: could not set exports/ lifecycle rule"
              echo "bucket ready"

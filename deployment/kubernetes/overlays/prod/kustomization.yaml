# Prod overlay — multiple replicas for stateless services, real
# hostname, real registry/tag. Update the values below before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saintaugustin

resources:
  - ../../base

images:
  - name: ghcr.io/REPLACE_ME/saintaugustin-auth
    newName: REGISTRY/saintaugustin-auth
    newTag: v1.0.0
  - name: ghcr.io/REPLACE_ME/saintaugustin-projection
    newName: REGISTRY/saintaugustin-projection
    newTag: v1.0.0
  - name: ghcr.io/REPLACE_ME/saintaugustin-frontend
    newName: REGISTRY/saintaugustin-frontend
    newTag: v1.0.0

patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml
  - path: replicas-patch.yaml

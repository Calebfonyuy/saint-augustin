# Replace the placeholder host with the dev hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saintaugustin
  namespace: saintaugustin
spec:
  rules:
    - host: saintaugustin.dev.local
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: projection-service
                port:
                  number: 3000
          - path: /ws/projection
            pathType: Prefix
            backend:
              service:
                name: projection-service
                port:
                  number: 3000
          - path: /api/projection
            pathType: Prefix
            backend:
              service:
                name: projection-service
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

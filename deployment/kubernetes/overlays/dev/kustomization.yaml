# Dev overlay — single replica everywhere, debug enabled, more
# permissive logging. Set `images:` and the `host:` patch below before
# applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saintaugustin

resources:
  - ../../base

# Override the placeholder registry/tag here.
images:
  - name: ghcr.io/REPLACE_ME/saintaugustin-auth
    newName: REGISTRY/saintaugustin-auth
    newTag: dev
  - name: ghcr.io/REPLACE_ME/saintaugustin-projection
    newName: REGISTRY/saintaugustin-projection
    newTag: dev
  - name: ghcr.io/REPLACE_ME/saintaugustin-frontend
    newName: REGISTRY/saintaugustin-frontend
    newTag: dev

patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml

# Auth Service — Laravel 12 + Apache/mod_php (see services/auth/Dockerfile).
#
# Migrations run as a Job on each `kubectl apply` (the Job's `name` is
# generated from the image tag at overlay time, so a new tag = a new
# Job = fresh migration run). This keeps multi-replica deployments
# safe: only one pod ever runs `migrate --force`.
#
# The Deployment itself starts Apache directly with no migration step,
# so individual pod restarts don't race the database.
# See 06b_queue_worker.yaml for the background job processor.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: staug
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: staug
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: calebfonyuy/staug-api:0.2
          command: ["/bin/sh", "-c"] 
          args:
            - |
              php artisan migrate --force
              php artisan db:seed --force
          envFrom:
            - configMapRef:
                name: staug-config
            - secretRef:
                name: staug-secrets
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: POSTGRES_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: staug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # The calebfonyuy/staug-* images are public today. If you push them to
      # a private registry, create a docker-registry Secret and reference it
      # here (and on the queue-worker / projection / frontend Deployments):
      #   kubectl -n staug create secret docker-registry regcred \
      #     --docker-server=... --docker-username=... --docker-password=...
      # imagePullSecrets:
      #   - name: regcred
      containers:
        - name: auth
          image: calebfonyuy/staug-api:0.2
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: staug-config
            - secretRef:
                name: staug-secrets
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            # Give the container time to boot Apache/PHP before the liveness
            # clock starts, so a slow cold start is not mistaken for a hang.
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"

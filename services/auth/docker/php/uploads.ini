; SaintAugustin Auth Service – PHP upload limits
;
; Loaded by the official php:8.3-cli-alpine image at runtime because every
; .ini file under /usr/local/etc/php/conf.d/ is auto-included (see the
; output of `php --ini`). The Dockerfile copies this file in.
;
; The "zz-" prefix in the destination filename ensures this file is parsed
; AFTER the docker-php-ext-*.ini extension files, so our values win on any
; conflict.
;
; Why these values:
;   - SongImportController accepts VideoPsalm `.vpagd` archives. The largest
;     real-world bundle observed so far is ~11 MB (parish library), but the
;     parser handles arbitrary sizes — 50 MB gives a comfortable cushion
;     without making the service a dumping ground.
;   - SongSheetController caps each PDF/image at 10 MB (FR5). That sits
;     comfortably inside this PHP-level ceiling.
;
; If you need to raise the cap:
;   1. Bump `upload_max_filesize` and `post_max_size` here (post_max_size
;      MUST be ≥ upload_max_filesize, with a few MB headroom for multipart
;      form fields).
;   2. Bump `uploads.max_size_bytes` in config/uploads.php (or set
;      UPLOAD_MAX_MB in .env) so the Laravel-side validator agrees.
;   3. Rebuild the auth-service container — these ini files are baked in
;      at image build time.
;
; Ref: https://www.php.net/manual/en/ini.core.php#ini.upload-max-filesize

upload_max_filesize = 100M
post_max_size       = 100M

; Octane keeps a worker resident, so memory_limit applies per-request.
; ZipArchive opens the .vpagd archive directly off disk (no in-memory load),
; but Laravel's request handling, validation, and JSON encoding for the
; preview list all want headroom. 256M is generous for our workload.
memory_limit        = 256M

; FrankenPHP is fast but parsing a 380-song archive plus DB inserts can
; brush past the default 30s timeout if the database is cold. 120s is a
; pragmatic ceiling — if you hit it, the import probably has a real bug.
max_execution_time  = 120
max_input_time      = 120

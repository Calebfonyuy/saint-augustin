# =============================================================================
# SaintAugustin – Docker Compose (Local Development)
# Runs the full stack: infrastructure + microservices + frontend
#
# Usage:
#   cp .env.example .env          # then edit passwords
#   docker compose up -d           # start everything
#   docker compose logs -f auth-service   # tail a specific service
#   docker compose down -v         # stop and remove volumes
#
# Ref: https://docs.docker.com/compose/compose-file/
# =============================================================================

services:

  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: sa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saintaugustin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saintaugustin}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Automatically creates the default bucket on first start
  minio-init:
    image: minio/mc:latest
    container_name: sa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin_changeme};
        mc mb --ignore-existing local/saintaugustin;
        mc anonymous set download local/saintaugustin/public;
        echo '>>> Bucket saintaugustin created.';
        exit 0;
      "

  gateway:
    image: nginx:1.27-alpine
    container_name: sa-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - frontend

  # ===========================================================================
  # BACKEND SERVICES
  # ===========================================================================

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: sa-auth
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:GENERATE_ME_WITH_php_artisan_key_generate}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sa_auth
      DB_USERNAME: ${POSTGRES_USER:-saintaugustin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_at_least_32_chars}
      # MinIO / Object Storage (Phase 2 — song sheets)
      FILESYSTEM_DISK: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}
      MINIO_BUCKET: ${MINIO_BUCKET:-saintaugustin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      SONG_SHEET_URL_TTL: ${SONG_SHEET_URL_TTL:-15}
    ports:
      - "${AUTH_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./services/auth:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Placeholder services (uncomment as each is built in later phases) ---

  # song-service:
  #   build:
  #     context: ./services/song
  #     dockerfile: Dockerfile
  #   container_name: sa-song
  #   environment:
  #     DB_DATABASE: sa_songs
  #     DB_HOST: postgres
  #     DB_USERNAME: ${POSTGRES_USER:-saintaugustin}
  #     DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # playlist-service:
  #   build:
  #     context: ./services/playlist
  #     dockerfile: Dockerfile
  #   container_name: sa-playlist
  #   environment:
  #     DB_DATABASE: sa_playlists
  #     DB_HOST: postgres
  #     DB_USERNAME: ${POSTGRES_USER:-saintaugustin}
  #     DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # file-service:
  #   build:
  #     context: ./services/file
  #     dockerfile: Dockerfile
  #   container_name: sa-file
  #   depends_on:
  #     minio:
  #       condition: service_healthy

  # import-service:
  #   build:
  #     context: ./services/import
  #     dockerfile: Dockerfile
  #   container_name: sa-import
  #   depends_on:
  #     redis:
  #       condition: service_healthy

  projection-service:
    build:
      context: ./services/projection
      dockerfile: Dockerfile
    container_name: sa-projection
    restart: unless-stopped
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    volumes:
      - ./services/projection:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # FRONTEND
  # ===========================================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sa-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${GATEWAY_HTTP_PORT:-8080}/api
      VITE_WS_URL: ws://localhost:${GATEWAY_HTTP_PORT:-8080}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

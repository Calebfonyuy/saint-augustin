# =============================================================================
# SaintAugustin – Docker Compose (Local Development)
# Runs the full stack: infrastructure + microservices + frontend
#
# Usage:
#   cp .env.example .env          # then edit passwords
#   docker compose up -d           # start everything
#   docker compose logs -f auth-service   # tail a specific service
#   docker compose down -v         # stop and remove volumes
#
# Ref: https://docs.docker.com/compose/compose-file/
# =============================================================================

services:

  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: staug-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saintaugustin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      # Required by docker/postgres/init-databases.sh to create the auth DB.
      DB_AUTH_NAME: ${DB_AUTH_NAME:-saintaugustin_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saintaugustin}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: staug-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: staug-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://staug-minio:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Automatically creates the default bucket on first start
  minio-init:
    image: minio/mc:latest
    container_name: staug-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}
    entrypoint: >
      /bin/sh -c "
        set -e;
        mc alias set local http://sa-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/saintaugustin;
        mc anonymous set download local/saintaugustin/public;
        echo '>>> Bucket saintaugustin created.';
      "

  # ===========================================================================
  # BACKEND SERVICES
  # ===========================================================================

  auth-service:
    image: calebfonyuy/staug-api:${APP_VERSION:-latest}
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: staug-api
    restart: unless-stopped
    working_dir: /var/www/html
    environment: &auth-service-env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:GENERATE_ME_WITH_php_artisan_key_generate}
      APP_NAME: ${APP_NAME:-STAUG}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_AUTH_NAME:-saintaugustin_db}
      DB_USERNAME: ${POSTGRES_USER:-saintaugustin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_at_least_32_chars}
      # STAUG data-interchange archive signing (HMAC)
      STAUG_SIGNING_KEY: ${STAUG_SIGNING_KEY:-changeme_staug_signing_key_at_least_32_chars}
      # MinIO / Object Storage (Phase 2 — song sheets)
      FILESYSTEM_DISK: minio
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}
      MINIO_BUCKET: ${MINIO_BUCKET:-saintaugustin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      SONG_SHEET_URL_TTL: ${SONG_SHEET_URL_TTL:-15}
      # Frontend URL (for CORS and email links)
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_PROJECTION_URL: ${VITE_PROJECTION_BASE_URL:-http://localhost:3000}
      # Email settings
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-a3267a5074290e}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-6f5f3ca2cff388}
      # MAIL_SCHEME: ${MAIL_SCHEME:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@saintaugustin.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-"SaintAugustin"}
    ports:
      - "${AUTH_SERVICE_PORT:-8000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3

  # Background job processor — required for queued jobs (e.g. the STAUG
  # full-DB export job) instead of running them synchronously in-request.
  queue-worker:
    image: calebfonyuy/staug-api:${APP_VERSION:-latest}
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: staug-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=5", "--sleep=3"]
    environment: *auth-service-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  projection-service:
    image: calebfonyuy/staug-projection:${APP_VERSION:-latest}
    build:
      context: ./services/projection
      dockerfile: Dockerfile
    container_name: staug-projection
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      AUTH_SERVICE_URL: "http://${BASE_SERVER_IP:-localhost}:${API_PORT:-8020}"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${PROJECTION_SERVICE_PORT:-3000}:3000"
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3

  # ===========================================================================
  # FRONTEND
  # ===========================================================================

  frontend:
    image: calebfonyuy/staug-frontend:${APP_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: staug-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_WS_URL: ${VITE_WS_URL}
      VITE_PROJECTION_BASE_URL: ${VITE_PROJECTION_BASE_URL}

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  default:
    name: staug-network
    driver: bridge
